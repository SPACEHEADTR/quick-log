<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quick Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Quick Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F4F3EF;--paper:#FFFFFF;--ink:#1B1B18;--muted:#7A7970;--line:#E7E4DB;--green:#1F8A5B}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;color-scheme:light;background:#F4F3EF}
  body{background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',sans-serif;line-height:1.5;margin:0}
  .page{max-width:600px;margin:0 auto;padding:18px 16px 100px;background:var(--bg);min-height:100vh}

  header{display:flex;align-items:center;justify-content:space-between}
  .brand{font-size:20px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;color:var(--ink)}
  .brand .dot{width:18px;height:18px;border-radius:6px;background:var(--green)}
  .gear{background:none;border:none;font-size:19px;color:var(--muted);cursor:pointer;padding:4px;line-height:1}
  .date{font-size:13px;color:var(--muted);margin:3px 0 14px 1px;font-weight:500}

  #settings{display:none;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}
  #settings p{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.5}
  #settings input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:12px}

  /* hero on the gradient */
  .hero{position:sticky;top:8px;z-index:10;text-align:center;padding:18px 16px;border-radius:22px;margin-bottom:14px;background:linear-gradient(150deg,#ECA42A 0%,#F2C150 56%,#F7D67E 100%);box-shadow:0 10px 28px rgba(214,150,40,.24)}
  .row2{display:flex;align-items:center;justify-content:center;gap:22px}
  .metric{text-align:center}
  .vline{width:1px;align-self:stretch;min-height:44px;background:rgba(255,255,255,.42)}
  .ml{display:block;font-size:12px;color:rgba(255,255,255,.9);margin-top:7px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.16)}
  .cbig,.cbig2{display:block;font-weight:300;font-size:46px;line-height:1;letter-spacing:-.025em;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.18)}
  .ctar{display:block;font-size:14px;color:rgba(255,255,255,.9);margin-top:10px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.16)}
  .stats{display:flex;justify-content:center;margin-top:18px}
  .stat{flex:0 0 auto;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.34);border-radius:16px;padding:11px 26px}
  .sl{font-size:10.5px;letter-spacing:.02em;color:rgba(255,255,255,.85);font-weight:500;margin-bottom:5px}
  .sv{font-size:18px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.16)}

  /* month dots */
  .cal{display:flex;gap:9px;justify-content:space-between;margin:2px 0 18px}
  .mcol{flex:1}
  .mlab{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;text-align:center}
  .dots{display:grid;grid-template-columns:repeat(7,1fr);gap:2.5px}
  .dot{aspect-ratio:1;width:100%;border-radius:2.5px;background:#E2DFD4}
  .dot.green{background:var(--green)}
  .dot.yellow{background:#E3A21F}
  .dot.red{background:#C53A2E}
  .dot.today{box-shadow:0 0 0 1.4px var(--bg),0 0 0 2.6px var(--green)}

  #chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:6px 11px 6px 13px;font-size:13px;font-weight:700;cursor:pointer}
  .chip .x{opacity:.5;font-weight:500}
  .chip:active{transform:scale(.95)}

  .grp{margin-bottom:15px}
  .grp h3{font-size:14px;font-weight:700;margin-bottom:9px;padding-bottom:7px;border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:8px}
  .grid{display:grid;grid-template-columns:1fr;gap:7px}
  @media(min-width:440px){.grid{grid-template-columns:1fr 1fr}}
  .add{position:relative;overflow:visible;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:11px 12px;cursor:pointer;font-family:inherit;color:var(--ink);transition:transform .08s,box-shadow .12s}
  .bimg{flex:0 0 auto;width:46px;height:42px;display:flex;align-items:center;justify-content:center}
  .bimg img{max-width:46px;max-height:42px;width:auto;height:auto;mix-blend-mode:multiply;display:block;pointer-events:none}
  .bc,.bn,.bk,.bimg{position:relative;z-index:1;pointer-events:none}
  .add:active{transform:scale(.97)}
  .add.flash{box-shadow:0 0 0 2px var(--green) inset}
  .bc{flex:0 0 auto;width:46px;font-size:11px;font-weight:700;border:1px solid;border-radius:7px;padding:4px 0;text-align:center;letter-spacing:.02em}
  .bn{flex:1;font-size:13.5px;line-height:1.2;text-align:left}
  .bk{flex:0 0 auto;min-width:72px;text-align:right;font-size:11px;color:var(--muted);font-weight:500;line-height:1.25}
  .bk b{display:block;font-weight:700;color:var(--ink);font-size:13px}
  .mac{display:block;font-size:10px}
  .lim{display:inline-block;width:7px;height:7px;border-radius:50%;background:#C53A2E;vertical-align:middle;margin-left:3px}

  .actions{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:0 auto;padding:12px 14px 16px;display:flex;gap:10px;align-items:center;background:linear-gradient(to top,var(--bg) 55%,transparent)}
  .save{display:inline-flex;align-items:center;justify-content:center;margin:0 auto;border:1px solid var(--line);border-radius:11px;padding:8px 18px;font-family:inherit;font-size:12.5px;font-weight:600;background:var(--paper);color:var(--muted);cursor:pointer;box-shadow:none;transition:transform .08s,color .12s}
  .save:active{transform:scale(.97);color:var(--green)}
  .save:active{transform:scale(.98)}
  .reset{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:13px;padding:13px 16px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;min-width:88px}
  .reset.arm{border-color:#B4441C;color:#B4441C}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#1B1B18;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .done{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(244,243,239,.9);backdrop-filter:blur(7px);z-index:50;padding:24px}
  .done.show{display:flex}
  .done-card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:32px 30px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.16);animation:pop .5s cubic-bezier(.2,.85,.25,1)}
  @keyframes pop{from{transform:scale(.85) translateY(14px);opacity:0}to{transform:none;opacity:1}}
  .check{width:76px;height:76px;margin-bottom:16px}
  .ck-c{fill:none;stroke:var(--green);stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:draw .55s ease forwards .12s}
  .ck-p{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:42;stroke-dashoffset:42;animation:draw .4s ease forwards .5s}
  @keyframes draw{to{stroke-dashoffset:0}}
  .done-card h3{font-size:26px;font-weight:800;letter-spacing:-.01em;margin-bottom:7px;color:var(--ink)}
  .done-card .sum{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px}
  .done-card .sub{font-size:12.5px;color:var(--muted)}

  @media(prefers-reduced-motion:no-preference){.fade{opacity:0;transform:translateY(8px);animation:rise .5s ease forwards}@keyframes rise{to{opacity:1;transform:none}}}

  .hint{flex:1;font-size:12px;color:var(--muted);font-weight:500;padding-left:4px}
  .lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px}
  .lock-inner{width:100%;max-width:300px;text-align:center}
  .lk-brand{font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
  .lk-brand .dot{width:18px;height:18px;border-radius:6px;background:var(--green)}
  .lk-sub{font-size:13px;color:var(--muted);margin:9px 0 28px}
  .pc-dots{display:flex;justify-content:center;gap:10px;margin-bottom:34px}
  .pc-dots i{width:11px;height:11px;border-radius:50%;border:1.6px solid #C7C4B8;transition:.15s}
  .pc-dots i.on{background:var(--green);border-color:var(--green)}
  .pc-dots.err{animation:shk .4s}
  @keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
  .pc-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;max-width:264px;margin:0 auto}
  .pc-pad button{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-family:inherit;font-size:24px;font-weight:500;color:var(--ink);cursor:pointer;transition:transform .07s,background .12s}
  .pc-pad button:active{transform:scale(.93);background:#EFEDE6}
  .pc-pad button[data-del]{border:none;background:none;font-size:22px;color:var(--muted)}
  .hist{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(27,27,24,.4);backdrop-filter:blur(4px)}
  .hist.show{display:flex}
  .hist-card{background:var(--paper);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:18px 18px 26px;max-height:80vh;display:flex;flex-direction:column;animation:slup .3s ease}
  @keyframes slup{from{transform:translateY(34px);opacity:.5}to{transform:none;opacity:1}}
  .hist-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .hist-head h3{font-size:18px;font-weight:800}
  .hist-head button{background:none;border:none;font-size:17px;color:var(--muted);cursor:pointer}
  .hist-list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
  .hrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .hdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .hdot.green{background:var(--green)}.hdot.yellow{background:#E3A21F}.hdot.red{background:#C53A2E}
  .hdate{flex:1;font-weight:600}
  .hk{font-weight:700}
  .hp{color:var(--muted);min-width:46px;text-align:right;font-size:12px}
  .hempty{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;line-height:1.5}
  .hist-foot{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
  .foot{text-align:center;margin-top:24px;font-size:11px;color:var(--muted);line-height:1.7}
  .foot .fh{display:block;opacity:.85;margin-bottom:3px}
  .legend{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--muted);margin:0 0 14px 1px}
  .legend b{color:var(--ink);font-weight:700}
  .lsep{opacity:.45}
.editbar{display:none;align-items:center;justify-content:space-between;gap:10px;background:#FBEEDC;border:1px solid #EAD9B8;color:#8A5A12;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;margin:0 0 14px}
  .editbar.show{display:flex}
  .editbar button{border:none;background:#8A5A12;color:#fff;border-radius:9px;padding:6px 13px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .dot.active{outline:2px solid #8A5A12;outline-offset:1px}
  .hrow{cursor:pointer}
  .hgo{color:var(--muted);opacity:.55;margin-left:2px;font-size:16px}

  .ml small{display:block;font-size:11px;opacity:.85;margin-top:2px}
  .next{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 14px}
  .next .nh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .next .nt{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .next .nday{font-size:11.5px;color:var(--muted);font-weight:600}
  .next .nm{font-size:15px;font-weight:700;margin-top:4px;line-height:1.35}
  .next .ns{font-size:12.5px;color:var(--muted);margin-top:2px}
  .sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .sugg button{border:1px solid var(--line);background:#F7F6F1;border-radius:99px;padding:6px 12px;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer}
  .sugg button:active{transform:scale(.95)}
  .sugg button.go{background:var(--green);border-color:var(--green);color:#fff}
  .bc svg{display:block;margin:0 auto}
  .htop{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .hl{text-align:left;padding-left:4px;min-width:0}
  .kbig{display:block;font-weight:300;font-size:54px;line-height:1;letter-spacing:-.03em;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.18)}
  .ksub{display:block;font-size:14px;font-weight:600;color:rgba(255,255,255,.95);margin-top:8px;text-shadow:0 1px 3px rgba(0,0,0,.16)}
  .ktag{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:3px 10px}
  .plate{flex:0 0 auto;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.10)}
  .plate svg{display:block}
  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;background:rgba(255,255,255,.94);border-radius:14px;padding:9px 4px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .mc{text-align:center;padding:0 4px}
  .mc+.mc{border-left:1px solid #EDEAE2}
  .mn{display:flex;align-items:center;justify-content:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#7A7970}
  .mn i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .mv{font-size:17px;font-weight:800;color:#1B1B18;line-height:1.25;margin-top:2px}
  .mv small{font-size:11px;font-weight:600;color:#7A7970}
  .ms{font-size:10.5px;font-weight:600;color:#7A7970;margin-top:1px}
  .ms.ok{color:#1F8A5B}.ms.over{color:#C53A2E}
  .hwrap{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .hero .row2{justify-content:flex-start;gap:16px;padding-left:4px}
  .hero .cbig,.hero .cbig2{font-size:40px}
  .mring{flex:0 0 auto;line-height:0}
  .mleg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;margin-top:12px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.95);text-shadow:0 1px 3px rgba(0,0,0,.16)}
  .mleg .li{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .mleg .li i{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .mleg .li.ov{background:rgba(122,30,20,.55);border-radius:99px;padding:1px 8px}
  .mleg b{font-weight:800}
  .macros{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 10px 10px;margin:0 0 14px}
  .macros .mh{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 4px 6px}
  .mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
  .mr svg{display:block;margin:0 auto}
  .mn{font-size:12px;font-weight:700;margin-top:2px}
  .mt{font-size:11px;color:var(--muted);line-height:1.2}
  .md{font-size:11px;font-weight:600;margin-top:2px;line-height:1.2}
  .md.mu{color:var(--muted)}.md.ok{color:var(--green)}.md.over{color:#C53A2E}
  .cal .dot{aspect-ratio:2.2/1;border-radius:2px}
  .cal .dots{gap:2px}
  .cal .dot.blank{background:transparent;box-shadow:none}
  .cal{margin:0 0 14px}
  .mlab{margin-bottom:5px}
</style>
</head>
<body>
<div class="page">

<header class="fade">
  <div class="brand"><span class="dot"></span>Quick Log</div>
  <button class="gear" id="histBtn" title="History">&#9776;</button>
</header>
<div class="date fade" id="date">—</div>
<div class="editbar" id="editbar"><span id="editLabel"></span><button id="todayBtn">Today</button></div>

<div class="cal fade" id="cal" style="animation-delay:.05s"></div>

<div class="hero fade" id="hero" style="animation-delay:.1s">
  <div class="htop">
    <div class="hl">
      <span class="kbig" id="kBig">0</span>
      <span class="ksub" id="kLab">of 0 kcal</span>
      <span class="ktag" id="kTag">Rest day</span>
    </div>
    <div class="plate" id="mring"></div>
  </div>
  <div class="mgrid" id="mleg"></div>
</div>


<div id="chips" class="fade" style="animation-delay:.14s"></div>

<div id="menu" class="fade" style="animation-delay:.18s"></div>

<div class="foot">made by @spaceheadtr</div>

</div>

<div class="actions">
  <button class="save" id="saveBtn">Save today</button>
</div>
<div class="done" id="done">
  <div class="done-card">
    <svg class="check" viewBox="0 0 52 52"><circle class="ck-c" cx="26" cy="26" r="24"/><path class="ck-p" d="M15 27l8 8 15-16"/></svg>
    <h3>Saved to history</h3>
    <div class="sum" id="doneSum"></div>
    <div class="sub">See you tomorrow · tap to close</div>
  </div>
</div>
<div class="hist" id="hist">
  <div class="hist-card">
    <div class="hist-head"><h3>History</h3><button id="histClose">&#10005;</button></div>
    <div class="hist-list" id="histList"></div>
    <div class="hist-foot">Green — on target · Yellow — under · Red — over · Sundays are free · tap a day on the calendar too</div>
  </div>
</div>
<div class="lock" id="lock">
  <div class="lock-inner">
    <div class="lk-brand"><span class="dot"></span>Quick Log</div>
    <div class="lk-sub">Enter passcode</div>
    <div class="pc-dots" id="pcDots"><i></i><i></i><i></i></div>
    <div class="pc-pad" id="pcPad">
      <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
      <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
      <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
      <span></span><button data-d="0">0</button><button data-del>&#9003;</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---- Plan: «Тело мечты», Nov 2026 – Jan 2027 ----
   Targets by weekday (getDay: 0=Sun). Sunday = free day (no kcal target, protein-first). */
const PLAN={
  1:{n:'Rest day',k:1950,p:160,run:false},
  2:{n:'Quality run',k:2660,p:160,run:true},
  3:{n:'Gym',k:2230,p:160,run:false},
  4:{n:'Easy run',k:2500,p:160,run:true},
  5:{n:'Gym',k:2230,p:160,run:false},
  6:{n:'Long run',k:3200,p:160,run:true,long:true},
  0:{n:'Free day',k:0,p:150,run:false}
};
/* Old items kept so past days still add up correctly */
const LEGACY={
  B:{n:'Porridge',k:470,p:34,f:8}, E:{n:'Espresso',k:5,p:0,f:0}, F:{n:'Filter coffee',k:5,p:0,f:0},
  L1:{n:'Tuna poke',k:600,p:50,f:20}, L2:{n:'Teriyaki chicken',k:600,p:50,f:18}, L3:{n:'Miso salmon',k:700,p:45,f:35},

const mem={};
async function sGet(key){
  if(typeof window!=='undefined' && window.storage){try{const r=await window.storage.get(key);return r?r.value:null;}catch(e){}}
  try{const v=localStorage.getItem(key);if(v!==null)return v;}catch(e){}
  return key in mem?mem[key]:null;
}
async function sSet(key,val){
  if(typeof window!=='undefined' && window.storage){try{await window.storage.set(key,val);}catch(e){}}
  try{localStorage.setItem(key,val);}catch(e){}
  mem[key]=val;
}
function keyFor(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dateOf(key){const a=key.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
const START='2026-10-29';
function planFor(key){if(key<START)return {n:'Before plan',k:2450,p:165,run:false,legacy:true};return PLAN[dateOf(key).getDay()];}
const TODAY=keyFor(new Date());
let activeDate=TODAY;
let log=[], DAYS={};
function totals(){let k=0,p=0,c=0,f=0,fb=0;log.forEach(x=>{const it=ITEMS[x];if(it){k+=it.k;p+=it.p;c+=it.c||0;f+=it.f||0;fb+=it.fb||0;}});return{k,p,c,f,fb};}
function fmtN(n){return Math.round(n).toLocaleString('en-US');}

/* status: t>0 → target day; t===0 → free day; t undefined → old days (2,000–2,450) */
function statusFor(d){
  const k=d.k,t=d.t;
  if(t===undefined){if(k>2450)return 'red';if(k>=2000)return 'green';return 'yellow';}
  if(t===0)return 'green';
  if(k>t+150)return 'red';if(k>=t-200)return 'green';return 'yellow';
}
function stopsFor(t){
  if(!t)return [[0,150,148,138],[1200,31,138,91],[4000,31,138,91]];
  return [[0,150,148,138],[Math.round(t*.6),232,178,46],[t-200,31,138,91],[t+150,31,138,91],[t+300,197,58,46]];
}
function colorFor(k,t){
  const S=stopsFor(t);
  if(k<=S[0][0])return S[0].slice(1);
  for(let i=1;i<S.length;i++){
    if(k<=S[i][0]){const a=S[i-1],b=S[i],x=(k-a[0])/(b[0]-a[0]);
      return [a[1]+(b[1]-a[1])*x,a[2]+(b[2]-a[2])*x,a[3]+(b[3]-a[3])*x];}
  }
  return S[S.length-1].slice(1);
}
function shade(c,toWhite,amt){return c.map(v=>Math.round(v+((toWhite?255:0)-v)*amt));}
function paint(k){
  document.getElementById('kBig').textContent=fmtN(k);
  const rgb=colorFor(k,planFor(activeDate).k).map(Math.round);
  const base='rgb('+rgb.join(',')+')';
  const tint='rgb('+shade(rgb,1,.22).join(',')+')';
  const dark='rgb('+shade(rgb,0,.15).join(',')+')';
  const h=document.getElementById('hero');
  h.style.background='linear-gradient(150deg,'+tint+' 0%,'+base+' 58%,'+dark+' 100%)';

}
let curK=0,colorRAF=null;
function tweenTo(target){
  cancelAnimationFrame(colorRAF);
  const start=curK,t0=performance.now(),dur=600;
  function step(now){let p=Math.min(1,(now-t0)/dur);p=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    curK=start+(target-start)*p;paint(curK);
    if(p<1)colorRAF=requestAnimationFrame(step);else{curK=target;paint(curK);}}
  colorRAF=requestAnimationFrame(step);
}

function macroTargets(pl){

}

  const radii=[47,38,29,20];let svg='<svg viewBox="0 0 110 110" width="112" height="112">';let g='';
  MAC.forEach((m,i)=>{
    const r=radii[i],C=2*Math.PI*r,val=t[m[0]],free=!pl.k&&(m[0]==='c'||m[0]==='f'),tg=free?0:T[m[0]];
    svg+='<circle cx="55" cy="55" r="'+r+'" fill="none" stroke="'+m[2]+'" stroke-opacity=".14" stroke-width="7"/>';
    let st='',cls='';
    if(tg){const pct=val/tg;
      if(val>0)svg+='<circle cx="55" cy="55" r="'+r+'" fill="none" stroke="'+m[2]+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+Math.max(.1,Math.min(pct,1)*C).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 55 55)"/>';
      const d=Math.round(val-tg);
      if(pct>1.1&&m[3]){svg+='<circle cx="55" cy="55" r="'+r+'" fill="none" stroke="#C53A2E" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(Math.min(pct-1,1)*C).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 55 55)"/>';st='+'+d+' over';cls='over';}
      else if(pct>=.9){st='✓ done';cls='ok';}
      else{st=(-d)+' left';}
    } else st='free';
    g+='<div class="mc"><div class="mn"><i style="background:'+m[2]+'"></i>'+m[1]+'</div><div class="mv">'+Math.round(val)+(tg?'<small>/'+tg+'</small>':'<small> g</small>')+'</div><div class="ms '+cls+'">'+st+'</div></div>';
  });
  svg+='<text x="55" y="60.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1B1B18" font-family="Hanken Grotesk,sans-serif">'+Math.round(t.p)+'<tspan font-size="8" font-weight="600" fill="#7A7970">g</tspan></text>';
  ringEl.innerHTML=svg+'</svg>';leg.innerHTML=g;
}

function render(){
  const {k,p}=totals(),pl=planFor(activeDate);
  document.getElementById('kLab').textContent=pl.k?('of '+fmtN(pl.k)+' kcal'+(k>pl.k?' · +'+fmtN(k-pl.k):' · '+fmtN(pl.k-k)+' left')):'kcal · free day';
  document.getElementById('kTag').textContent=pl.n;
  tweenTo(k);
  const chips=document.getElementById('chips');
  if(log.length===0){chips.innerHTML='';}
  else{const counts={},order=[];log.forEach(c=>{if(!(c in counts)){counts[c]=0;order.push(c);}counts[c]++;});
    chips.innerHTML=order.map(c=>'<span class="chip" data-code="'+c+'">'+(ITEMS[c]?ITEMS[c].n.replace(/ \(.*\)/,''):c)+(counts[c]>1?' ×'+counts[c]:'')+' <span class="x">✕</span></span>').join('');}
  renderMacros();
}

const MONTHS=[['Nov',2026,11,30],['Dec',2026,12,31],['Jan',2027,1,31]];
function monthBlock(name,y,m,days){
  let dots='';
  const off=(new Date(y,m-1,1).getDay()+6)%7;for(let i=0;i<off;i++)dots+='<span class="dot blank"></span>';
  for(let d=1;d<=days;d++){const key=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    let cls='dot';if(DAYS[key])cls+=' '+statusFor(DAYS[key]);if(key===TODAY)cls+=' today';if(key===activeDate&&key!==TODAY)cls+=' active';
    dots+='<span class="'+cls+'" data-key="'+key+'" title="'+key+'"></span>';}
  return '<div class="mcol"><div class="mlab">'+name+'</div><div class="dots">'+dots+'</div></div>';
}
function renderCal(){document.getElementById('cal').innerHTML=MONTHS.map(m=>monthBlock(m[0],m[1],m[2],m[3])).join('');}

function buildMenu(){
  document.getElementById('menu').innerHTML=GROUPS.map(g=>{
    const btns=g.i.map(c=>{const it=ITEMS[c];const left=IMAGES[c]?'<span class="bimg"><img src="'+IMAGES[c]+'" alt=""></span>':'<span class="bc" style="background:'+g.c+'14;color:'+g.c+';border-color:'+g.c+'40">'+icon(it.ic||g.ic,g.c,20)+'</span>';return '<button class="add" data-code="'+c+'">'+left+'<span class="bn">'+it.n+(LIMIT.has(c)?' <span class="lim"></span>':'')+'</span><span class="bk"><b>'+it.k+'</b><span class="mac">'+it.p+'p · '+it.f+'f</span></span></button>';}).join('');
    return '<div class="grp" id="'+g.id+'"><h3 style="border-color:'+g.c+'33">'+icon(g.ic,g.c)+g.t+'</h3><div class="grid">'+btns+'</div></div>';
  }).join('');
}

async function save(){
  await sSet('qlog:'+activeDate,JSON.stringify(log));
  const {k,p}=totals();
  if(log.length>0){const pl=planFor(activeDate);DAYS[activeDate]=pl.legacy?{k:k,p:p}:{k:k,p:p,t:pl.k};}else delete DAYS[activeDate];
  await sSet('qlog:days',JSON.stringify(DAYS));
  renderCal();
}
function add(code){log.push(code);render();save();}
function removeOne(code){const i=log.lastIndexOf(code);if(i>-1){log.splice(i,1);render();save();}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900);}

function fmtDate(key){return dateOf(key).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}
function renderHistory(){
  const keys=Object.keys(DAYS).sort().reverse();
  const list=document.getElementById('histList');
  if(keys.length===0){list.innerHTML='<div class="hempty">Nothing logged yet. Tap food to start your day.</div>';return;}
  list.innerHTML=keys.map(key=>{const d=DAYS[key];const st=statusFor(d);
    return '<div class="hrow" data-key="'+key+'"><span class="hdot '+st+'"></span><span class="hdate">'+fmtDate(key)+'</span><span class="hk">'+fmtN(d.k)+'</span><span class="hp">'+d.p+' g</span><span class="hgo">›</span></div>';}).join('');
}

let doneTimer=null;
function showDone(k,p){
  const o=document.getElementById('done');
  document.getElementById('doneSum').textContent=fmtN(k)+' kcal · '+p+' g protein';
  o.querySelectorAll('.ck-c,.ck-p').forEach(el=>{el.style.animation='none';el.getBoundingClientRect();el.style.animation='';});
  o.classList.add('show');clearTimeout(doneTimer);doneTimer=setTimeout(()=>o.classList.remove('show'),3000);
}
function fmtLong(key){return dateOf(key).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}
async function openDay(key){
  activeDate=key;
  const saved=await sGet('qlog:'+key);
  log=[]; if(saved){try{log=JSON.parse(saved)||[];}catch(e){log=[];}}
  document.getElementById('date').textContent=fmtLong(key);
  const editing=key!==TODAY;
  document.getElementById('editbar').classList.toggle('show',editing);
  if(editing)document.getElementById('editLabel').textContent='Editing '+fmtDate(key);
  document.getElementById('saveBtn').textContent=editing?'Save day':'Save today';
  curK=totals().k;paint(curK);render();renderCal();
  window.scrollTo({top:0,behavior:'smooth'});
}
async function init(){
  buildMenu();
  const dd=await sGet('qlog:days');if(dd){try{DAYS=JSON.parse(dd);}catch(e){DAYS={};}}
  await openDay(TODAY);

  document.getElementById('menu').addEventListener('click',e=>{const b=e.target.closest('.add');if(!b)return;add(b.dataset.code);b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),200);});
  document.getElementById('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;removeOne(c.dataset.code);});
  document.getElementById('cal').addEventListener('click',e=>{const dot=e.target.closest('.dot');if(!dot||!dot.dataset.key)return;openDay(dot.dataset.key);});
  const hist=document.getElementById('hist');
  document.getElementById('histBtn').addEventListener('click',()=>{renderHistory();hist.classList.add('show');});
  document.getElementById('histClose').addEventListener('click',()=>hist.classList.remove('show'));
  hist.addEventListener('click',e=>{if(e.target===hist)hist.classList.remove('show');});
  document.getElementById('histList').addEventListener('click',e=>{const r=e.target.closest('.hrow');if(!r||!r.dataset.key)return;hist.classList.remove('show');openDay(r.dataset.key);});
  document.getElementById('todayBtn').addEventListener('click',()=>openDay(TODAY));
  document.getElementById('done').addEventListener('click',()=>document.getElementById('done').classList.remove('show'));
  document.getElementById('saveBtn').addEventListener('click',async()=>{await save();const t=totals();if(log.length>0)showDone(t.k,t.p);else toast('Nothing logged yet');});
}

const PASS='143';
function setupLock(){
  const lock=document.getElementById('lock');
  if(sessionStorage.getItem('qlog:unlocked')==='1'){lock.style.display='none';return;}
  let entry='';
  const dots=document.getElementById('pcDots');
  function paintDots(){const c=dots.children;for(let i=0;i<c.length;i++)c[i].classList.toggle('on',i<entry.length);}
  document.getElementById('pcPad').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-del')){entry=entry.slice(0,-1);paintDots();return;}
    if(entry.length>=3)return;
    entry+=b.getAttribute('data-d');paintDots();
    if(entry.length===3){
      if(entry===PASS){try{sessionStorage.setItem('qlog:unlocked','1');}catch(e){}lock.style.display='none';}
      else{dots.classList.add('err');setTimeout(()=>{dots.classList.remove('err');entry='';paintDots();},450);}
    }
  });
}


init();
setupLock();
</script>
